<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lista de Projetos</title>
</head>
<body>
    <h1>Lista de Projetos</h1>
    <a href="{% url 'criar_projeto' %}">Criar Novo Projeto</a>
    <hr>
    <ul>
        {% for projeto in projetos %}
            <li>
                <strong>{{ projeto.nome }}</strong> - {{ projeto.data_inicio }}
                <p>{{ projeto.descricao }}</p>
                <a href="{% url 'editar_projeto' projeto.id %}">Editar</a> | 
                <a href="{% url 'deletar_projeto' projeto.id %}">Excluir</a>
            </li>
        {% empty %}
            <li>Nenhum projeto cadastrado.</li>
        {% endfor %}
    </ul>
</body>
</html>
