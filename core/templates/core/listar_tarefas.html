<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lista de Tarefas</title>
</head>
<body>
    <h1>Lista de Tarefas</h1>
    <a href="{% url 'criar_tarefa' %}">Nova Tarefa</a> | <a href="{% url 'listar_projetos' %}">Ver Projetos</a>
    <hr>
    <ul>
        {% for tarefa in tarefas %}
            <li>
                <strong>{{ tarefa.titulo }}</strong> [{{ tarefa.status }}] - Projeto: {{ tarefa.projeto.nome }}
                | <a href="{% url 'editar_tarefa' tarefa.id %}">Editar</a>
                | <a href="{% url 'deletar_tarefa' tarefa.id %}">Excluir</a>
            </li>
        {% empty %}
            <li>Nenhuma tarefa cadastrada.</li>
        {% endfor %}
    </ul>
</body>
</html>
